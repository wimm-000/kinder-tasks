<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Kinder Tasks</title>
  <desc id="description">Hucha coral con una marca de verificación y una moneda dorada.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#005968" />
      <stop offset="1" stop-color="#003f4c" />
