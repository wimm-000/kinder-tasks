    <linearGradient id="pig" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7049" />
      <stop offset="1" stop-color="#ff5738" />
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc331" />
      <stop offset="1" stop-color="#ffad12" />
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#background)" />

  <!-- Coin -->
  <circle cx="518" cy="130" r="84" fill="url(#coin)" />
  <circle cx="518" cy="130" r="61" fill="none" stroke="#004b59" stroke-width="8" />

