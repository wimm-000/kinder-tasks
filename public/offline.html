<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#174b4a" />
    <title>Sin conexión | Kinder Tasks</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Avenir Next", ui-sans-serif, system-ui, sans-serif;
        background: #f7f3e9;
        color: #123b3a;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }

      main {
        width: min(100%, 520px);
        border: 1px solid #d9d1bf;
        border-radius: 32px;
        background: #fffdf7;
        padding: clamp(28px, 7vw, 48px);
        box-sizing: border-box;
        box-shadow: 0 24px 70px -36px rgb(13 44 43 / 0.45);
      }

      img {
        width: 56px;
        height: 56px;
        border-radius: 16px;
      }

      h1 {
        margin: 28px 0 12px;
        font-family: Georgia, serif;
        font-size: clamp(2rem, 7vw, 3rem);
        line-height: 1.05;
      }

      p {
        color: #557170;
        font-size: 1.05rem;
        line-height: 1.7;
      }

      button {
        min-height: 48px;
        margin-top: 16px;
        padding: 0 24px;
        border: 0;
        border-radius: 999px;
        background: #174b4a;
        color: #fffdf7;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:focus-visible {
        outline: 3px solid #ed8069;
        outline-offset: 4px;
      }

      [hidden] {
        display: none;
      }
      .summary {
        margin-top: 24px;
        border-top: 1px solid #d9d1bf;
        padding-top: 20px;
      }
      .balance {
        margin: 8px 0 20px;
        color: inherit;
        font-family: Georgia, serif;
        font-size: 2.5rem;
        font-weight: 700;
      }
      ul {
        padding-left: 20px;
        color: #557170;
        line-height: 1.8;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #0c2929;
          color: #f5efdf;
        }

        main {
          border-color: #2e5554;
          background: #123837;
        }

        p {
          color: #c5bcaa;
        }

        button {
          background: #f4cf63;
          color: #0c2929;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/app-icon.svg" alt="" />
      <h1>Ahora mismo no tienes conexión</h1>
      <p>
        Puedes consultar los últimos datos guardados si un adulto activó esta opción en el
        dispositivo.
      </p>
      <section class="summary" id="snapshot" hidden>
        <h2>Últimos datos sincronizados</h2>
        <p class="balance" id="balance"></p>
        <p id="synced-at"></p>
        <h3>Movimientos recientes</h3>
        <ul id="transactions"></ul>
        <h3>Tareas disponibles</h3>
        <ul id="tasks"></ul>
      </section>
      <p id="no-data">No hay datos offline disponibles en este dispositivo.</p>
      <button id="retry" type="button">Volver a intentar</button>
    </main>
    <script>
      document.getElementById("retry").addEventListener("click", () => window.location.reload());
      const request = indexedDB.open("kinder-tasks-offline", 1);
      request.onsuccess = () => {
        const database = request.result;
        if (!database.objectStoreNames.contains("snapshots")) return;
        const activeKey = sessionStorage.getItem("kinder-offline-active-key");
        if (!activeKey) return;
        const read = database
          .transaction("snapshots", "readonly")
          .objectStore("snapshots")
          .get(activeKey);
        read.onsuccess = () => {
          const latest = read.result;
          if (!latest || new Date(latest.expiresAt) <= new Date()) return;
          document.getElementById("snapshot").hidden = false;
          document.getElementById("no-data").hidden = true;
          document.getElementById("balance").textContent = new Intl.NumberFormat("es-ES", {
            style: "currency",
            currency: "EUR",
          }).format(latest.balanceCents / 100);
          document.getElementById("synced-at").textContent =
            `Sincronizado: ${new Intl.DateTimeFormat("es-ES", {
              dateStyle: "medium",
              timeStyle: "short",
            }).format(new Date(latest.syncedAt))}`;
          const transactions = document.getElementById("transactions");
          for (const movement of latest.transactions.slice(0, 10)) {
            const item = document.createElement("li");
            item.textContent = `${movement.description} · ${new Intl.NumberFormat("es-ES", {
              style: "currency",
              currency: "EUR",
            }).format(movement.amountCents / 100)}`;
            transactions.append(item);
          }
          if (!latest.transactions.length) {
            const item = document.createElement("li");
            item.textContent = "No había movimientos recientes.";
            transactions.append(item);
          }
          const list = document.getElementById("tasks");
          for (const task of latest.tasks) {
            const item = document.createElement("li");
            item.textContent = `${task.title} · ${new Intl.NumberFormat("es-ES", {
              style: "currency",
              currency: "EUR",
            }).format(task.rewardCents / 100)}`;
            list.append(item);
          }
          if (!latest.tasks.length) {
            const item = document.createElement("li");
            item.textContent = "No había tareas disponibles.";
            list.append(item);
          }
        };
      };
    </script>
  </body>
</html>
